<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Payment | Gym Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar{
            background:#111827 !important;
            padding:15px;
        }

        .navbar-brand{
            color:#FFD700 !important;
            font-size:26px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            font-weight:500;
        }

        .nav-link:hover{
            color:#FFD700 !important;
        }

        /* Header */
        .header-section{
            background:linear-gradient(90deg,#111827,#16a34a);
            color:white;
            text-align:center;
            padding:40px 20px;
        }

        .header-section h1{
            font-size:40px;
            font-weight:bold;
        }

        /* Payment Card */
        .payment-card{
            max-width:750px;
            margin:auto;
            margin-top:-35px;
            background:white;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            padding:30px;
        }

        .payment-card h2{
            color:#16a34a;
            text-align:center;
            font-weight:bold;
            margin-bottom:25px;
        }

        .info-box{
            background:#d1fae5;
            color:#166534;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            font-weight:600;
        }

        label{
            font-weight:bold;
            color:#374151;
            margin-bottom:6px;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#16a34a;
            box-shadow:0 0 10px rgba(22,163,74,.3);
        }

        .btn-payment{
            background:#16a34a;
            color:white;
            border:none;
            border-radius:12px;
            padding:14px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-payment:hover{
            background:#15803d;
        }

        footer{
            background:#111827;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/">💪 Gym Management</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/member/">Members</a>
            <a class="nav-link" href="/trainers/">Trainers</a>
            <a class="nav-link" href="/attendance-list/">Attendance</a>
            <a class="nav-link" href="/payment-list/">Payments</a>
        </div>

    </div>
</nav>

<!-- Header -->
<div class="header-section">
    <h1>💳 Member Payment</h1>
    <p>Record membership fees and payment status.</p>
</div>

<!-- Payment Form -->
<div class="container mb-5">

    <div class="payment-card">

        <div class="info-box">
            💰 Select a registered member and record the payment details.
        </div>

        <h2>Add Payment</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <!-- Member -->
                <div class="col-md-6 mb-3">
                    <label>👤 Member Name</label>

                    <select name="member" id="member" class="form-select" required>
                        <option value="">Select Member</option>

                        {% for member in members %}
                        <option value="{{ member.id }}"
                                data-join-date="{{ member.join_date|date:'Y-m-d' }}">
                            {{ member.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Amount -->
                <div class="col-md-6 mb-3">
                    <label>💵 Amount (₹)</label>

                    <input type="number"
                           name="amount"
                           class="form-control"
                           placeholder="Enter Amount"
                           min="1"
                           required>
                </div>

                <!-- Payment Date -->
                <div class="col-md-6 mb-3">
                    <label>📅 Payment Date</label>

                    <input type="date"
                           name="payment_date"
                           id="payment_date"
                           class="form-control"
                           required>
                </div>

                <!-- Status -->
                <div class="col-md-6 mb-3">
                    <label>💳 Payment Status</label>

                    <select name="status" class="form-select" required>
                        <option value="">Select Status</option>
                        <option value="Paid">✅ Paid</option>
                        <option value="Pending">⏳ Pending</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="btn btn-payment w-100 mt-3">
                ✅ Save Payment
            </button>

        </form>

    </div>

</div>

<!-- JavaScript -->
<script>
const memberSelect = document.getElementById("member");
const paymentDate = document.getElementById("payment_date");

memberSelect.addEventListener("change", function () {

    const joinDate = this.options[this.selectedIndex].dataset.joinDate;

    paymentDate.value = joinDate;
    paymentDate.max = joinDate;
});
</script>

<!-- Footer -->
<footer>
    © 2026 Gym Management System | Payment Management
</footer>

</body>
</html>
