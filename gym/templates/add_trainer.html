<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Trainer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar{
            background:#111827 !important;
            padding:15px;
        }

        .navbar-brand{
            color:#FFD700 !important;
            font-size:26px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            font-weight:500;
        }

        .nav-link:hover{
            color:#FFD700 !important;
        }

        /* Header */
        .header-section{
            background:linear-gradient(90deg,#111827,#2563eb);
            color:white;
            padding:40px 20px;
            text-align:center;
        }

        .header-section h1{
            font-size:40px;
            font-weight:bold;
        }

        /* Form Card */
        .trainer-card{
            max-width:750px;
            margin:auto;
            margin-top:-35px;
            background:white;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            padding:30px;
        }

        .trainer-card h2{
            color:#2563eb;
            text-align:center;
            font-weight:bold;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            color:#374151;
            margin-bottom:6px;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:0 0 10px rgba(37,99,235,.3);
        }

        .info-box{
            background:#dbeafe;
            color:#1d4ed8;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            font-weight:600;
        }

        .btn-save{
            background:#2563eb;
            color:white;
            border:none;
            border-radius:12px;
            padding:14px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-save:hover{
            background:#1d4ed8;
        }

        footer{
            background:#111827;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/">💪 Gym Management</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/member/">Members</a>
            <a class="nav-link" href="/trainers/">Trainers</a>
            <a class="nav-link" href="/attendance-list/">Attendance</a>
            <a class="nav-link" href="/payment-list/">Payments</a>
        </div>

    </div>
</nav>

<!-- Header -->
<div class="header-section">
    <h1>🏋️ Trainer Registration</h1>
    <p>Add a new trainer to the Gym Management System.</p>
</div>

<!-- Form -->
<div class="container mb-5">

    <div class="trainer-card">

        <div class="info-box">
            📋 Please enter all trainer details correctly.
        </div>

        <h2>Add Trainer</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>👤 Trainer Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter Trainer Name"
                           pattern="[A-Za-z ]+"
                           title="Name should contain only letters."
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>🆔 Trainer ID</label>
                    <input type="number"
                           name="trainer_id"
                           class="form-control"
                           placeholder="Enter Trainer ID"
                           min="1"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>📞 Mobile Number</label>
                    <input type="tel"
                           name="phone"
                           class="form-control"
                           placeholder="10 Digit Mobile Number"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           title="Enter exactly 10 digits."
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>📧 Email Address</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter Email Address"
                           required>
                </div>

                <div class="col-12 mb-4">
                    <label>💪 Specialization</label>
                    <input type="text"
                           name="specialization"
                           class="form-control"
                           placeholder="Example: Cardio, Strength Training, Yoga"
                           required>
                </div>

            </div>

            <button type="submit" class="btn btn-save w-100">
                ✅ Save Trainer
            </button>

        </form>

    </div>

</div>

<!-- Footer -->
<footer>
    © 2026 Gym Management System | Trainer Registration
</footer>

</body>
</html>
