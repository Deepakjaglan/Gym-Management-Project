<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Member | Gym Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar{
            background:#111827 !important;
            padding:15px;
        }

        .navbar-brand{
            color:#FFD700 !important;
            font-size:26px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            font-weight:500;
        }

        .nav-link:hover{
            color:#FFD700 !important;
        }

        /* Header */
        .header-section{
            background:linear-gradient(90deg,#111827,#F59E0B);
            color:white;
            text-align:center;
            padding:40px 20px;
        }

        .header-section h1{
            font-size:38px;
            font-weight:bold;
        }

        /* Card */
        .update-card{
            max-width:750px;
            margin:auto;
            margin-top:-35px;
            background:white;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
            padding:30px;
        }

        .update-card h2{
            color:#F59E0B;
            text-align:center;
            font-weight:bold;
            margin-bottom:25px;
        }

        .info-box{
            background:#FEF3C7;
            color:#92400E;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-bottom:20px;
            font-weight:600;
        }

        label{
            font-weight:bold;
            color:#374151;
            margin-bottom:6px;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
        }

        .form-control:focus,
        .form-select:focus{
            border-color:#F59E0B;
            box-shadow:0 0 10px rgba(245,158,11,.3);
        }

        .btn-update{
            background:#F59E0B;
            color:white;
            border:none;
            border-radius:12px;
            padding:14px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-update:hover{
            background:#D97706;
        }

        footer{
            background:#111827;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/">💪 Gym Management</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/member/">Members</a>
            <a class="nav-link" href="/trainers/">Trainers</a>
            <a class="nav-link" href="/attendance-list/">Attendance</a>
            <a class="nav-link" href="/payment-list/">Payments</a>
        </div>

    </div>
</nav>

<!-- Header -->
<div class="header-section">
    <h1>✏️ Update Member Details</h1>
    <p>Edit member information and save the changes.</p>
</div>

<!-- Update Form -->
<div class="container mb-5">

    <div class="update-card">

        <div class="info-box">
            📝 Update the required fields and click **Update Member**.
        </div>

        <h2>Member Information</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>👤 Full Name</label>
                    <input type="text"
                           name="name"
                           value="{{ member.name }}"
                           class="form-control"
                           pattern="[A-Za-z ]+"
                           title="Name should contain only letters."
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>🎂 Age</label>
                    <input type="number"
                           name="age"
                           value="{{ member.age }}"
                           min="12"
                           max="100"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>⚧ Gender</label>
                    <select name="gender" class="form-select" required>
                        <option value="Male" {% if member.gender == "Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if member.gender == "Female" %}selected{% endif %}>Female</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>📞 Mobile Number</label>
                    <input type="tel"
                           name="phone"
                           value="{{ member.phone }}"
                           class="form-control"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           title="Enter exactly 10 digits."
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>📧 Email Address</label>
                    <input type="email"
                           name="email"
                           value="{{ member.email }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>📅 Join Date</label>
                    <input type="date"
                           name="join_date"
                           value="{{ member.join_date|date:'Y-m-d' }}"
                           class="form-control"
                           required>
                </div>

                <div class="col-12 mb-4">
                    <label>📍 Address</label>
                    <textarea name="address"
                              rows="3"
                              class="form-control"
                              required>{{ member.address }}</textarea>
                </div>

            </div>

            <div class="row">
                <div class="col-md-6 mb-2">
                    <a href="/member/" class="btn btn-secondary w-100">
                        ← Back to Members
                    </a>
                </div>

                <div class="col-md-6 mb-2">
                    <button type="submit" class="btn btn-update w-100">
                        ✅ Update Member
                    </button>
                </div>
            </div>

        </form>

    </div>

</div>

<!-- Footer -->
<footer>
    © 2026 Gym Management System | Update Member
</footer>

</body>
</html>
